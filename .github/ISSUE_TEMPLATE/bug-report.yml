# Workbench modification: include browser reports and identify the fork revision.
name: Bug report / 故障反馈
description: Something fails, crashes, or behaves differently from the docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先检索本仓库的 Issues。可以用中文或英文描述问题。公开粘贴日志或截图前，请隐去密钥、持仓、私人报告和本机路径。
        Search this repository's Issues first. Redact credentials, portfolio details and personal paths from logs or screenshots.
  - type: input
    id: version
    attributes:
      label: Version
      description: Workbench release tag, or the output of `git rev-parse --short HEAD` for a source checkout.
      placeholder: "workbench-v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: How you run it
      options:
        - Web workbench (tradingagents-web)
        - CLI (tradingagents)
        - Python package (TradingAgentsGraph)
        - Backtest (run_backtest or tradingagents backtest)
        - Docker
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Python and browser versions
      description: Include the browser for issues in the Web workbench.
  - type: input
    id: models
    attributes:
      label: LLM provider and models
      description: Include the quick and deep model names if the problem occurs during a run.
  - type: input
    id: run
    attributes:
      label: Ticker and analysis date
      placeholder: "NVDA, 2026-09-23"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or code to reproduce
      description: The smallest steps or snippet that shows the problem.
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The full traceback or log lines, as text rather than a screenshot.
      render: text
